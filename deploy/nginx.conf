server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # El service worker, su registro y el HTML siempre frescos:
    # si quedaran en caché, las actualizaciones nunca llegarían a la tablet.
    location ~ ^/(sw\.js|registerSW\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        # Nginx no trae este tipo. Se declara solo aquí: un bloque `types` a nivel de server
        # reemplazaría todos los demás tipos y el JS saldría como octet-stream.
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Archivos con hash en el nombre (JS, CSS, imágenes, workbox): nunca cambian.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Audios e íconos: sin hash, pero el service worker los precachea y revisa sus versiones.
    location ~ ^/(audio|icons)/ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
